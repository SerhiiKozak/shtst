services:
  app:
    user: "${UID}:${GID}"
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: shtst
    volumes:
      - ./laravel:/var/www
    depends_on:
      - mysql

  nginx:
    image: nginx:latest
    container_name: shtst_nginx
    ports:
      - "8000:80"
    volumes:
      - ./laravel:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  mysql:
    image: mysql:8.0
    container_name: shtst_db
    restart: always
    environment:
      MYSQL_DATABASE: shtst
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_PASSWORD: root123
      MYSQL_USER: shtst_root
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql

volumes:
  dbdata:
